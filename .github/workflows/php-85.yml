name: PHP 8.5 compatibility

on:
  push:
    paths:
      - "public/api/**/*.php"
      - ".github/workflows/php-85.yml"
  pull_request:
    paths:
      - "public/api/**/*.php"
      - ".github/workflows/php-85.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: curl, json
      - name: Lint PHP files
        run: find public/api -type f -name '*.php' -print0 | xargs -0 -n1 php -l
